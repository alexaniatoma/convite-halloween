<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css"> 

    <title>Halloween</title>
    
</head>
<body>
    <header class="capa-convite">
        <img src="./assets/img/capa.jpg" alt="Aboboras assustadoras" class="img-capa">
        <section class="corpo-convite">            
            <h1 class="titulo-capa">Halloween</h1>
            <p class="subtitulo-capa">Party 2026</p>
            <p class="texto-capa">Prepare-se para a noite mais assombrada do ano!</p>            
            <div class="mobile">
                <div class="texto-mobile">
                    <p class="fantasia-mobile">Fantasias obrigatórias</p>
                    <p class="diversao-mobile">Diversão garantida</p>
                </div>                          
            </div>            
            <div class="btn">
                <button class="btn-presenca">&#127917; Confirmar Presença</button>
                <button class="btn-detalhes">&#128123; Ver detalhes</button>
            </div>
        </section>                
    </header>
    <section class="detalhes-evento">        
        <h2 class="titulo-evento">Detalhes do evento</h2>
        <div class="info-eventos">
            <article class="evento">
            <img src="./assets/img/calendario.png" alt="Icone de um calendário">
            <p class="evento-rotulo">Data</p>
            <p class="evento-valor">31 de Outubro</p>
            <p class="evento-detalhe">Sábado</p>
        </article>
        <article class="evento">
            <img src="./assets/img/relogio.png" alt="Icone de um relógio">
            <p class="evento-rotulo">Horário</p>
            <p class="evento-valor">20:00-02:00</p>
            <p class="evento-detalhe">6 horas de terror</p>
        </article>
        <article class="evento">
            <img src="./assets/img/pin.png" alt="Icone de um ponto marcando o local">
            <p class="evento-rotulo">Local</p>
            <p class="evento-valor">Casa Assombrada</p>
            <p class="evento-detalhe">Rua do Medo, 13</p>
        </article>
        <article class="evento">
            <img src="./assets/img/pessoas.png" alt="Icone de tres pessoas">
            <p class="evento-rotulo">Dress Code</p>
            <p class="evento-valor">Fantasias</p>
            <p class="evento-detalhe">Obrigatório!</p>
        </article>
        </div>            
    </section>    
</body>
</html>
